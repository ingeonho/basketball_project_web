<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERPUNK BASKETBALL 2077</title>
    <!-- 사이버펑크 전용 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cyber-container">
        <!-- CRT 레트로 스캔라인 이펙트 레이어 -->
        <div class="scanline"></div>
        
        <!-- 웹캠 동영상 비가시화 레퍼런스 -->
        <video id="webcam" autoplay playsinline muted></video>
        
        <!-- 메인 게임 캔버스 (화면 전체 꽉 차게 조절) -->
        <canvas id="gameCanvas"></canvas>

        <!-- 사이버펑크 닉네임 입력 모달 -->
        <div id="nicknameModal" class="cyber-modal hidden">
            <div class="cyber-modal-content">
                <div class="glitch-title" data-text="SYSTEM RECORD">SYSTEM RECORD</div>
                <h2 class="cyber-subtitle">🎉 NEW HIGH SCORE DETECTED 🎉</h2>
                <p>명예의 전당 랭킹에 등록할 에이전트 닉네임</p>
                <input type="text" id="nicknameInput" maxlength="8" placeholder="NICKNAME" autofocus autocomplete="off">
                <button id="submitScoreBtn">DATA TRANSMIT ➔</button>
            </div>
        </div>

        <!-- 관리자 안내 알림 -->
        <div id="adminNotice" class="cyber-notice hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
